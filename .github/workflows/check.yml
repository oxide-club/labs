name: Check labs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cache-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/verify-cache-model.py
      - run: cc -std=c11 -Wall -Wextra -Wpedantic 005-cache-lab/materials/starter/cache.c -o /tmp/cache-starter
